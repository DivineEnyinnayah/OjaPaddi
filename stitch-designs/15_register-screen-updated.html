<body class="text-on-background min-h-screen flex flex-col">
<!-- Auth Layout Wrapper -->
<main class="flex-grow flex flex-col items-center justify-center px-margin py-xl">
<!-- Brand Header Section -->
<header class="text-center mb-xl w-full max-w-md">
<div class="flex justify-center mb-md">
<img alt="Oja Paddi Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrp_m_nPleqB26Fr8qCgz2GDxhe5el79jC1oiBjyKal3xEAF9MBNd4eQjTrCdM9M1XgBTbkfAyV5Z5qmGP3KdYdC0RocABXOf-OVENPdK-Mpq41RE-W0dvVc5x0bNzKF1WeVfx9ajJ6wYhXpEqk39vAB_GTteKXSASbHJxl38iKwp_Cn9ipTHPVf54X5Ft8kIOFbQT2_92jKavj8pLvxsnvne_oCAFChX0NkpJn38HQn9kNyMSBgBlYuKR6K1_qyk6fpbPTI5l-veq"/>
</div>
<h1 class="font-display text-display text-primary mb-xs">OjaPaddi</h1>
<p class="font-body-lg text-on-surface-variant">Join thousands of entrepreneurs growing their business today.</p>
</header>
<!-- Registration Card -->
<div class="w-full max-w-md bg-surface-container-lowest p-lg rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant">
<form class="space-y-md">
<!-- Full Name -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface block px-1">Full Name</label>
<div class="relative">
<input class="w-full h-12 px-md bg-surface-container rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg text-on-surface" placeholder="e.g. Chinelo Adebayo" type="text" value="Chinelo Adebayo"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="text-[11px] text-primary font-label-bold px-1">Looks great!</p>
</div>
<!-- Phone Number -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface block px-1">Phone Number</label>
<div class="flex gap-2">
<div class="flex items-center justify-center px-3 bg-surface-container border border-outline-variant rounded-lg font-body-sm text-on-surface-variant">
                            +234
                        </div>
<input class="flex-grow h-12 px-md bg-surface-container rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg text-on-surface" placeholder="801 234 5678" type="tel"/>
</div>
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface block px-1">Email</label>
<div class="relative">
<input class="w-full h-12 px-md bg-surface-container rounded-lg border border-error focus:border-error focus:ring-1 focus:ring-error outline-none transition-all font-body-lg text-on-surface" placeholder="name@business.com" type="email" value="chinelo@market"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-error" data-icon="error">error</span>
</div>
<p class="text-[11px] text-error font-label-bold px-1">Please enter a valid email address</p>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface block px-1">Password</label>
<div class="relative">
<input class="w-full h-12 px-md bg-surface-container rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg text-on-surface" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-3 top-3 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex gap-1 px-1 mt-1">
<div class="h-1.5 flex-grow bg-primary rounded-full"></div>
<div class="h-1.5 flex-grow bg-outline-variant rounded-full"></div>
<div class="h-1.5 flex-grow bg-outline-variant rounded-full"></div>
<div class="h-1.5 flex-grow bg-outline-variant rounded-full"></div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-2 pt-2">
<input class="mt-1 w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<p class="font-body-sm text-on-surface-variant">I agree to the <a class="text-primary font-bold" href="#">Terms of Service</a> and <a class="text-primary font-bold" href="#">Privacy Policy</a>.</p>
</div>
<!-- CTA Button -->
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg font-h2 shadow-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Secondary CTA/Link -->
<footer class="mt-lg text-center">
<p class="font-body-lg text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</footer>
</main>
<!-- Visual Anchor / Decorative Element -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-primary"></div>
<!-- Background Illustration (Subtle) -->
<div class="fixed -z-10 top-0 right-0 w-1/3 h-full opacity-5 pointer-events-none hidden md:block">
<img alt="Market Atmosphere" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBY9lzg2FH-tDbp2TFU1TtJZowG4k0-GswbCOiZN7pUbKdNhfOoPbYGMbV21PsewHyNj4STghOjWMmwmKqmQAn6hLOrsPapm3FDGUiOL68ynmJwifC3ZAyEQBSO41h_3UxqIEvYfiB5DoB1fl79JX4efvY9hlRdvd0dVWu4C-0mm415MnOacMrFRTzF0ZeX_8bWetIypS2pv1VgVCsBINA6IVQkdsNXM_IlOsNTK3Wj1fjCuotO50vnrRpeBlG5UlEwNYbm8Bkb0A7_"/>
</div>
</body></html>
