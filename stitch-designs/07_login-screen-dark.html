<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "surface-container-highest": "#353534",

                    "spacing": {

                        "unit": "4px",

                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppressed Shell: Linear Transactional Page -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-xl w-full max-w-md mx-auto">
<!-- Header Section -->
<div class="w-full text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-container mb-md">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-icon="storefront">storefront</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">OjaPaddi</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs">Your Market Friend</p>
</div>
<!-- Login Form Card -->
<div class="w-full bg-surface-container-low rounded-2xl p-lg border border-outline-variant/30">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-lg">Welcome Back</h2>
<form class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-highest border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary transition-all" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center ml-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-highest border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary transition-all" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-14 bg-primary text-on-primary font-label-bold text-label-bold rounded-xl flex items-center justify-center gap-sm active:scale-95 transition-transform mt-lg" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-lg gap-md">
<div class="h-[1px] flex-grow bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">OR</span>
<div class="h-[1px] flex-grow bg-outline-variant"></div>
</div>
<!-- Secondary Actions -->
<div class="grid grid-cols-2 gap-md">
<button class="flex flex-col items-center justify-center p-md bg-surface-container-highest rounded-xl border border-outline-variant hover:border-primary/50 transition-colors group">
<span class="material-symbols-outlined text-primary mb-xs group-hover:scale-110 transition-transform" data-icon="fingerprint">fingerprint</span>
<span class="font-label-sm text-label-sm text-on-surface">Biometric</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface-container-highest rounded-xl border border-outline-variant hover:border-primary/50 transition-colors group">
<span class="material-symbols-outlined text-primary mb-xs group-hover:scale-110 transition-transform" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-label-sm text-label-sm text-on-surface">QR Code</span>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to OjaPaddi? 
                <a class="text-primary font-bold hover:underline ml-xs" href="#">Create Account</a>
</p>
</div>
<!-- Decorative Element -->
<div class="mt-xl opacity-20 w-32 h-1 bg-gradient-to-r from-transparent via-primary to-transparent rounded-full"></div>
</main>
<!-- Visual Polish: Soft Glow background -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container/10 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary-container/10 blur-[120px] rounded-full"></div>
</div>
</body></html>
