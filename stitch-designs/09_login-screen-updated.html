<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .floating-label-group {
            position: relative;
        }
        .floating-label-group input:focus ~ label,
        .floating-label-group input:not(:placeholder-shown) ~ label {
            top: -10px;
            left: 10px;
            font-size: 11px;
            background-color: white;
            padding: 0 4px;
            color: #2e8b57;
            font-weight: 600;
        }
        .floating-label-group label {
            position: absolute;
            top: 14px;
            left: 16px;
            transition: all 0.2s ease;
            pointer-events: none;
        }
        body {
            min-height: max(884px, 100dvh);
            font-family: 'Plus Jakarta Sans', sans-serif;

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col items-center justify-between py-12 px-6">
<!-- Top Branding Section -->
<header class="w-full flex flex-col items-center gap-base">
<div class="w-20 h-20 flex items-center justify-center mb-4 overflow-hidden">
<img alt="OjaPaddi Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrp_m_nPleqB26Fr8qCgz2GDxhe5el79jC1oiBjyKal3xEAF9MBNd4eQjTrCdM9M1XgBTbkfAyV5Z5qmGP3KdYdC0RocABXOf-OVENPdK-Mpq41RE-W0dvVc5x0bNzKF1WeVfx9ajJ6wYhXpEqk39vAB_GTteKXSASbHJxl38iKwp_Cn9ipTHPVf54X5Ft8kIOFbQT2_92jKavj8pLvxsnvne_oCAFChX0NkpJn38HQn9kNyMSBgBlYuKR6K1_qyk6fpbPTI5l-veq"/>
</div>
<h1 class="font-h1 text-h1 text-primary">OjaPaddi</h1>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-sm flex flex-col gap-xl">
<div class="text-center">
<h2 class="font-display text-display text-on-surface mb-xs">Welcome Back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to manage your shop and sales.</p>
</div>
<!-- Login Form -->
<div class="bg-surface-container-lowest p-gutter rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant">
<form class="flex flex-col gap-lg">
<!-- Email Field -->
<div class="floating-label-group">
<input class="w-full h-12 px-md pt-sm pb-xs border border-outline rounded-[8px] bg-white text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="email" placeholder=" " type="email"/>
<label class="font-label-bold text-label-bold text-outline" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="floating-label-group">
<input class="w-full h-12 px-md pt-sm pb-xs border border-outline rounded-[8px] bg-white text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" placeholder=" " type="password"/>
<label class="font-label-bold text-label-bold text-outline" for="password">Password</label>
</div>
<div class="flex justify-end">
<a class="font-label-bold text-label-bold text-primary hover:underline" href="#">Forgot Password?</a>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-primary text-white font-h2 text-h2 rounded-[8px] shadow-sm hover:opacity-90 transition-all active:scale-95 flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
</div>
<!-- Social/Alternative Section -->
<div class="flex items-center gap-sm px-md">
<div class="flex-grow h-[1px] bg-outline-variant"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">OR SECURE ACCESS</span>
<div class="flex-grow h-[1px] bg-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-gutter">
<button class="flex items-center justify-center gap-sm h-12 border border-outline rounded-[8px] bg-white font-label-bold text-on-surface hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="fingerprint">fingerprint</span>
                Biometric
            </button>
<button class="flex items-center justify-center gap-sm h-12 border border-outline rounded-[8px] bg-white font-label-bold text-on-surface hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="qr_code_2">qr_code_2</span>
                QR Code
            </button>
</div>
</main>
<!-- Footer Section -->
<footer class="w-full max-w-sm text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
            New to OjaPaddi? 
            <a class="font-label-bold text-label-bold text-primary underline decoration-2 underline-offset-4 ml-xs" href="#">Create Account</a>
</p>
</footer>
<!-- Bottom Illustration -->
<div class="fixed bottom-0 left-0 w-full h-32 -z-10 opacity-10 pointer-events-none">
<div class="w-full h-full bg-gradient-to-t from-primary to-transparent"></div>
</div>
